# Base: agente contra Microsoft Foundry real, con las variables FOUNDRY_* de ../.env
#   docker compose -f devops/compose.yaml up --build agent
#   docker compose -f devops/compose.yaml run --rm --build tests
# Día 1 sin Azure: sumar devops/compose.mock.yaml (ver README)
services:
  agent:
    build: { context: .., dockerfile: devops/Dockerfile, target: runtime }
    image: agent:local
    ports: ["8000:8000"]
    env_file:
      - path: ../.env
        required: false

  tests:
    build: { context: .., dockerfile: devops/Dockerfile, target: test }
    image: agent:test
    profiles: ["test"]
